[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phototopost"
version = "0.1.0"
description = "写真フォルダから SNS 投稿用の画像・動画と投稿文を作るツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "pillow>=10",
    "pillow-heif>=0.16",
    "numpy>=1.26",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phototopost = "phototopost.cli:main"

[tool.setuptools]
packages = ["phototopost"]
